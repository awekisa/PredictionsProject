name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Job 1: Backend xUnit tests ────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=integration-test-only

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore PredictionsAPI.Tests/PredictionsAPI.Tests.csproj

      - name: Test
        run: dotnet test PredictionsAPI.Tests/PredictionsAPI.Tests.csproj --no-restore --verbosity normal

  # ─── Job 2: Frontend Cypress E2E tests ─────────────────────────────────────
  frontend-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: predictions-ui/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('predictions-ui/package-lock.json') }}

      - name: Install dependencies
        working-directory: predictions-ui
        run: npm ci

      - name: Verify Cypress
        working-directory: predictions-ui
        run: npx cypress install && npx cypress verify

      - name: Run Cypress E2E tests
        working-directory: predictions-ui
        run: |
          npm run dev &
          echo "Waiting for dev server..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 1; done'
          echo "Dev server ready"
          npx cypress run --browser chrome
        env:
          VITE_API_URL: http://localhost:5039/api
